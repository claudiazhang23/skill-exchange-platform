<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SkillSwap - 你教我一个技能，我教你一个技能。"
    />
    <title>SkillSwap | 技能互换平台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="主导航">
        <a class="brand" href="#" data-view="home" aria-label="SkillSwap 主页">
          <span class="brand-mark" aria-hidden="true"><i data-lucide="repeat-2"></i></span>
          <span>SkillSwap</span>
        </a>

        <nav class="main-nav" aria-label="主要功能">
          <button class="nav-item active" type="button" data-view="discover">
            <i data-lucide="compass"></i><span>发现</span>
          </button>
          <button class="nav-item" type="button" data-view="matches">
            <i data-lucide="sparkles"></i><span>智能匹配</span><b id="matchNavBadge">6</b>
          </button>
          <button class="nav-item" type="button" data-view="messages">
            <i data-lucide="message-circle"></i><span>消息</span><b class="coral" id="messageNavBadge">2</b>
          </button>
          <button class="nav-item" type="button" data-view="schedule">
            <i data-lucide="calendar-days"></i><span>我的约课</span><b class="amber" id="scheduleNavBadge" hidden>1</b>
          </button>
          <button class="nav-item" type="button" data-view="wallet">
            <i data-lucide="wallet-cards"></i><span>技能钱包</span>
          </button>
        </nav>

        <div class="sidebar-spacer"></div>

        <section class="exchange-balance" aria-label="技能币余额">
          <div class="balance-icon"><i data-lucide="coins"></i></div>
          <div>
            <span>技能币余额</span>
            <strong id="sideCoinBalance">128</strong>
          </div>
          <button
            class="icon-button"
            type="button"
            data-view="wallet"
            aria-label="打开技能钱包"
            title="打开技能钱包"
          >
            <i data-lucide="arrow-up-right"></i>
          </button>
        </section>

        <button class="profile-switcher" type="button" data-view="profile">
          <img
            id="sideProfileAvatar"
            src="https://images.unsplash.com/photo-1531123897727-8f129e1688ce?auto=format&fit=crop&w=120&q=85"
            alt="林安"
          />
          <span><strong id="sideProfileName">林安</strong><small>查看个人主页</small></span>
          <i data-lucide="more-horizontal"></i>
        </button>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <a class="mobile-brand" href="#" data-view="home" aria-label="SkillSwap 主页">
            <span class="brand-mark"><i data-lucide="repeat-2"></i></span>SkillSwap
          </a>

          <label class="global-search" for="skillSearch">
            <i data-lucide="search"></i>
            <input
              id="skillSearch"
              type="search"
              placeholder="搜索技能、课程或伙伴"
              autocomplete="off"
            />
            <kbd>/</kbd>
          </label>

          <div class="top-actions">
            <div class="notification-wrap">
              <button
                class="icon-button notification-button"
                type="button"
                data-action="toggle-notifications"
                aria-label="查看通知"
                title="查看通知"
              >
                <i data-lucide="bell"></i><span id="notificationDot"></span>
              </button>
              <div class="notification-menu" id="notificationMenu" hidden></div>
            </div>
            <button class="primary-button" type="button" data-action="open-skill-form" data-skill-type="teach">
              <i data-lucide="plus"></i><span>发布技能</span>
            </button>
          </div>
        </header>

        <main id="viewContent" tabindex="-1"></main>
      </section>
    </div>

    <nav class="mobile-nav" aria-label="移动端导航">
      <button type="button" data-view="discover"><i data-lucide="compass"></i><span>发现</span></button>
      <button type="button" data-view="matches"><i data-lucide="sparkles"></i><span>匹配</span></button>
      <button type="button" data-action="open-skill-form" data-skill-type="teach"><i data-lucide="plus-circle"></i><span>发布</span></button>
      <button type="button" data-view="schedule"><i data-lucide="calendar-days"></i><span>约课</span></button>
      <button type="button" data-view="profile"><i data-lucide="user-round"></i><span>我的</span></button>
    </nav>

    <dialog class="app-modal" id="appModal" aria-labelledby="modalTitle">
      <div id="modalContent"></div>
    </dialog>

    <aside class="chat-drawer" id="chatDrawer" aria-label="聊天窗口" aria-hidden="true"></aside>
    <div class="scrim" id="scrim" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
